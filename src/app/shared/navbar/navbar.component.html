<div class="navbar-wrapper">
  <div class="nav">
    <!-- Logo / Brand -->
    <a class="logo" routerLink="/">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
        <path d="M560-280h200v-80H560v80Zm0-160h200v-80H560v80ZM240-160q-33 0-56.5-23.5T160-240v-560q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-160H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/>
      </svg>
      <span>Resume Analyzer</span>
    </a>

    <!-- Navigation items / Profile and Logout on the right -->
    <div class="nav-links">
      @if (isLoggedIn()) {
        <a routerLink="/home" routerLinkActive="active">Workspace</a>
        <a routerLink="/dashboard" routerLinkActive="active">History</a>
        <a routerLink="/upload" routerLinkActive="active">Upload</a>
        
        <!-- Profile Badge & Direct Logout Button -->
        <div style="display: flex; align-items: center; gap: 14px; margin-left: 8px;">
          <div class="profile-avatar" [title]="userName() + ' (' + userEmail() + ')'" style="cursor: default;">
            {{ userInitials() }}
          </div>
          <button class="btn secondary" (click)="logout()" style="padding: 8px 16px; font-size: 0.85rem; border-radius: 99px; font-weight: 600;">
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</div>
