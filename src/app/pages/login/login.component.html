<div class="auth-container">
  <div class="auth-card">
    <h1 style="text-align: center; margin-bottom: 24px;">Login</h1>
    
    @if (infoMessage) {
      <div class="alert-banner" [class.warning]="infoType === 'warning'" [class.info]="infoType === 'info'">
        <div class="alert-icon">
          @if (infoType === 'warning') {
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
              <path d="m40-120 440-760 440 760H40Zm104-80h672L480-720 144-200Zm336-40q17 0 28.5-11.5T520-280q0-17-11.5-28.5T480-320q-17 0-28.5 11.5T440-280q0 17 11.5 28.5T480-240Zm-40-120h80v-200h-80v200Zm40-100Z"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
              <path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
            </svg>
          }
        </div>
        <div class="alert-content">
          {{ infoMessage }}
        </div>
      </div>
    }
    
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="name@company.com">
      </div>
      
      <div class="field">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>
      
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      
      <button class="btn" [disabled]="form.invalid || loading" style="margin-top: 6px;">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="divider">or continue with</div>

    <div class="sso-grid">
      <button type="button" class="btn outline" style="padding: 10px; font-size: 0.9rem; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.63 14.98 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.86 3q1.61-4.71 6.64-5.46Z"/>
          <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.27H12v4.51h6.43a5.52 5.52 0 0 1-2.4 3.62l3.72 2.89c2.18-2 3.74-4.97 3.74-8.75Z"/>
          <path fill="#FBBC05" d="M5.36 10.5a7.16 7.16 0 0 1 0-3l-3.86-3a11.93 11.93 0 0 0 0 9l3.86-3Z"/>
          <path fill="#34A853" d="M12 18.96c-1.66 0-3.2-.57-4.38-1.69l-3.27 3.27C6.33 22.37 9.02 23 12 23c4.65 0 8.6-2.65 10.5-6.5l-3.86-3q-1.61 4.71-6.64 5.46Z"/>
        </svg>
        Google
      </button>
      <button type="button" class="btn outline" style="padding: 10px; font-size: 0.9rem; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 23 23">
          <path fill="#F25022" d="M1 1h10v10H1z"/>
          <path fill="#7FBA00" d="M12 1h10v10H12z"/>
          <path fill="#00A4EF" d="M1 12h10v10H1z"/>
          <path fill="#FFB900" d="M12 12h10v10H12z"/>
        </svg>
        Outlook
      </button>
    </div>

    <p class="muted" style="margin-top: 24px; text-align: center; font-size: 0.9rem;">
      No account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
