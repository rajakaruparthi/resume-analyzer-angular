name: Deploy Angular App to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Build and Deploy Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Check SSH key exists
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | head -1
          echo "${{ secrets.EC2_SSH_KEY }}" | tail -1

      - name: Copy Angular build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/**"
          target: "~/angular-deploy"

      - name: Deploy to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Cleaning old Angular files..."
            sudo rm -rf /usr/share/nginx/html/*

            echo "Copying new Angular build..."
            sudo cp -r ~/angular-deploy/dist/*/* /usr/share/nginx/html/

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Angular deployment completed."
