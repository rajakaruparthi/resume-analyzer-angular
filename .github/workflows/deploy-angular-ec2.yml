name: Deploy Frontend to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build -- --configuration=production

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/resume-analyzer/gui/resume-analyzer-angular/dist/resume-analyzer-angular/browser
            rm -rf ~/resume-analyzer/gui/resume-analyzer-angular/dist/resume-analyzer-angular/browser/*

      - name: Copy built files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "dist/resume-analyzer-angular/browser/*"
          target: "~/resume-analyzer/gui/resume-analyzer-angular/dist/resume-analyzer-angular/browser"
          strip_components: 3

      - name: Rebuild Frontend Docker Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/resume-analyzer
            
            # Determine Docker Compose command variant
            if docker compose version &> /dev/null; then
              COMPOSE='docker compose'
            else
              COMPOSE='docker-compose'
            fi

            echo "Rebuilding frontend service..."
            $COMPOSE -f devops/docker-compose.prod.yml up --build -d frontend

            echo "Pruning unused Docker images..."
            docker image prune -f

            echo "Frontend deployment completed successfully."
            docker ps --filter name=ra-
