name: Deploy Angular App to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Build and Deploy Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keygen -y -f ~/.ssh/ec2_key.pem > /dev/null
          echo "SSH key is valid"

      - name: Copy Angular build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/ec2_key.pem
          source: "dist/**"
          target: "/home/${{ secrets.EC2_USER }}/angular-deploy"

      - name: Deploy to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/ec2_key.pem
          script: |
            set -e
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r /home/${{ secrets.EC2_USER }}/angular-deploy/dist/*/browser/* /usr/share/nginx/html/
            sudo systemctl restart nginx
